name: Build Khaerul Terminal (APK & EXE)

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Setup Project & Protect main.dart
        run: |
          mkdir backup_lib
          cp -r lib/* backup_lib/ 2>/dev/null || true
          flutter create . --org com.khaerul.terminal --project-name khaerul_terminal --overwrite
          cp -r backup_lib/* lib/
          rm -rf backup_lib
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: khaerul-terminal-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Setup Project & Protect main.dart
        run: |
          mkdir backup_lib
          xcopy /E /I /Y lib backup_lib
          flutter config --enable-windows-desktop
          flutter create . --org com.khaerul.terminal --project-name khaerul_terminal --platforms=windows --overwrite
          xcopy /E /I /Y backup_lib lib
          rmdir /S /Q backup_lib
          flutter pub get
          flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: khaerul-terminal-windows-exe
          path: build/windows/x64/runner/Release/
